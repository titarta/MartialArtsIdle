  <!--
    Magnifier-loupe suppression: handled by CSS user-select:none +
    -webkit-touch-callout:none in src/index.css (applied globally to *).
    Modern iOS Safari (16+) respects those for the long-press loupe.
    For the iOS App Store build (Capacitor / WKWebView) we suppress
    the loupe natively in the iOS shell instead of via JS, which is
    cleaner and zero touch-handler overhead.
    Browser/PWA is internal-dev only, so if the loupe appears there in
    some edge case it doesn't matter. The previous JS workaround
    interfered with fast successive swipes (every touchstart within
    300ms of a touchend was preventDefault'd) so it's gone.
  -->
  </head>
  <body>
    <div id="rotate-overlay" role="alert">
      <div class="rotate-icon">↻</div>
      <div class="rotate-title">Please rotate your device</div>
      <div class="rotate-sub">The Long Road is designed for portrait play.</div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
